spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/dummy-jwks
#
product-service-base-url=http://localhost:8081
rabbitmq.order-confirmation-queue=${RABBITMQ_ORDER_CONFIRMATION_QUEUE:new-queue}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
internal.service-token=internal-test-token-not-for-real-use-123456
